services:
  qdrant:
    # 与 requirements.txt 里的 qdrant-client 保持同一条 minor 线，可用 .env 覆盖
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.1}
    # 只绑本机，避免同网段直接访问；宿主机端口可用 .env 覆盖
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    # 只绑本机 + 密码认证（默认密码仅供本机使用，对外部署请在 .env 里换掉）
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:-kb-qa-local-dev}"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    # .env 不存在时也能启动；没配 LLM Key 时提问接口会给出提示
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      # 必须与上面 redis 的 --requirepass 是同一个值
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kb-qa-local-dev}
    depends_on:
      - qdrant
      - redis
    volumes:
      - ./documents:/app/documents
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  hf_cache:
